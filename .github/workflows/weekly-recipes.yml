name: Weekly recipe emailer

on:
  schedule:
    # Runs every Sunday at 15:00 UTC (adjust to your timezone).
    # Cron is always UTC — use https://crontab.guru to convert your local time.
    - cron: "0 15 * * 0"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab, for testing

permissions:
  contents: write  # needed so the workflow can commit the updated history file back

jobs:
  send-recipes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send recipes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python scripts/generate_recipes.py

      - name: Commit updated history
        run: |
          git config user.name "recipe-bot"
          git config user.email "actions@github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Update recipe history"
          git push
